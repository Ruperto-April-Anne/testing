<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bléum Nails</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <a href="../home/home_dashboard.html" class="btn-home">
        <i class="fa-solid fa-house"></i> Home
    </a>

    <div class="container">
        
        <div class="left-panel">
            <div class="logo">Bléum Nails</div>
        </div>

        <div class="right-panel">
            <div class="form-content">
                <h2>Log In</h2>
                <small>Welcome back, valued customer.</small>

                <form id="loginForm">
                    <div class="input-group">
                        <input type="email" id="email" placeholder=" " required>
                        <label for="email">Email</label>
                    </div>

                    <div class="input-group">
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder=" " required>
                            <label for="password">Password</label>
                            <i class="fa-regular fa-eye" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="remember-me-container">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Remember password
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">Login</button>
                </form>

                <div class="footer">
                    Don’t have an account? <a href="signup.html">Sign Up</a>
                </div>

                <div class="social-login">
                    <p>or continue with</p>
                    <div class="social-buttons">
                        <button class="social-btn google"><i class="fab fa-google"></i></button>
                        <button class="social-btn facebook"><i class="fab fa-facebook-f"></i></button>
                        <button class="social-btn apple"><i class="fab fa-apple"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlertModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="alertTitle">Notification</h3>
            <p id="alertMessage">Message goes here</p>
            <button id="alertOkBtn" class="btn-modal btn-confirm">OK</button>
        </div>
    </div>

    <div id="customPromptModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="promptTitle">Enter Info</h3>
            <input type="email" id="promptInput" placeholder="Enter your email">
            <div class="modal-actions">
                <button id="promptCancelBtn" class="btn-modal btn-cancel">Cancel</button>
                <button id="promptConfirmBtn" class="btn-modal btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
