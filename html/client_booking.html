<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Summary - Bléum Nails</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           1. CORE VARIABLES & RESET
           ========================================= */
:root {
    --bg-cream: #fffff0;
    --accent-blue: #6c99e8;
    --deep-navy: #0a0c6b;
    --text-white: #ffffff;
    --text-grey: #666;
    --error-red: #d32f2f;
    --success-green: #2e7d32;
    --font-main: "Times New Roman", Times, serif;
    --shadow-soft: 0 10px 30px rgba(10, 12, 107, 0.05);
    --shadow-hover: 0 15px 40px rgba(10, 12, 107, 0.1);
    --gold: #FFD700;
}

* {
    box-sizing: border-box;
    font-family: var(--font-main);
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-cream);
    color: var(--deep-navy);
    background-image: 
        radial-gradient(circle at 0% 0%, rgba(108, 153, 232, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(108, 153, 232, 0.3) 0%, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
}

body::-webkit-scrollbar {
    display: none;
    width: 0;
    background: transparent;
}

body {
    -ms-overflow-style: none; 
    scrollbar-width: none;     
}

html {
    overflow-y: scroll; 
    scrollbar-width: none; 
    -ms-overflow-style: none; 
}

html::-webkit-scrollbar {
    display: none;
}

button, input, select, textarea {
    outline: none;
    font-family: inherit;
}

h1, h2, h3 {
    font-weight: normal;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =========================================
           2. NAVIGATION BAR
           ========================================= */
nav {
    background: rgba(255, 255, 255, 0.3);
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    height: 55px;
    padding: 0 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 5px 20px rgba(0,0,0,0.02);
}

.logo {
    font-size: 24px;
    color: var(--deep-navy);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
}

.menu {
    display: flex;
    gap: 30px;
    align-items: center;
}

.menu-item {
    background: none;
    border: none;
    color: var(--deep-navy);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    font-weight: bold;
    padding: 8px 12px;
    border-radius: 20px;
}

.menu-item:hover,
.menu-item.active {
    background: rgba(255,255,255,0.6);
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 15px;
    border-left: 1px solid rgba(10, 12, 107, 0.1);
    padding-left: 20px;
}

.user-avatar {
    width: 35px;
    height: 35px;
    background: var(--deep-navy);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.btn-logout {
    background: transparent;
    color: var(--text-grey);
    border: none;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
}

.btn-logout:hover {
    color: var(--error-red);
}

/* =========================================
           3. BOOKING SUMMARY TABLE — Refined
           ========================================= */
.view-section {
    max-width: 1200px;
    margin: 50px auto;
    padding: 0 20px;
    display: block;
    animation: fadeIn 0.5s ease-out;
}

/* ----- Title wrapper like gallery/feedback/account (centered) ----- */
.section-title-wrapper {
    text-align: center;
    margin-bottom: 35px;
}

.section-title-wrapper h1 {
    font-size: 38px;
    color: var(--deep-navy);
    margin-bottom: 10px;
    letter-spacing: 1px;
    font-weight: normal;
}

.section-title-wrapper .sub-text {
    font-size: 16px;
    color: var(--text-grey);
    font-style: italic;
}

/* consistent container with other pages */
.booking-summary-container {
    margin-top: 10px;
    animation: fadeIn 0.8s ease-out;
}

/* glass-panel style matching profile card */
.glass-panel {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px 25px;
    box-shadow: var(--shadow-soft);
    border: 1px solid white;
}

.table-container {
    overflow-x: auto;
    overflow-y: auto;
    border-radius: 15px;
    background: white;
    border: none;
    max-height: 750px;
    scrollbar-width: thin; 
    scrollbar-color: var(--accent-blue) #f1f1f1;
    box-shadow: var(--shadow-soft);
}

.table-container::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.table-container::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.table-container::-webkit-scrollbar-thumb {
    background: var(--accent-blue);
    border-radius: 10px;
    transition: all 0.3s ease;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: var(--deep-navy);
}

.booking-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    /* Remove table borders */
    border: none;
}

.booking-table thead {
    position: sticky;
    top: 0;
    background: rgba(10, 12, 107, 0.05);
    backdrop-filter: blur(5px);
    z-index: 10;
}

.booking-table th {
    padding: 18px 15px;
    text-align: left;
    color: var(--deep-navy);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 11px;
    background: rgba(255,255,255,0.9);
    /* Keep the bottom border for header separation */
    border-bottom: 2px solid var(--deep-navy);
    /* Remove other borders */
    border-top: none;
    border-left: none;
    border-right: none;
}

.booking-table tbody tr {
    /* Use a very subtle divider or none at all */
    border-bottom: 1px solid rgba(10, 12, 107, 0.03);
    transition: all 0.3s ease;
}

.booking-table tbody tr:hover {
    background: rgba(108, 153, 232, 0.03);
}

.booking-table td {
    padding: 18px 15px;
    color: var(--text-grey);
    font-size: 13px;
    /* Remove cell borders */
    border: none;
}

.booking-table td:first-child {
    color: var(--deep-navy);
    font-weight: 500;
}

/* Style for empty state - center properly */
.booking-table tbody tr:only-child td[colspan] {
    text-align: center;
    padding: 40px !important;
    color: var(--text-grey) !important;
    font-style: italic;
    background: transparent;
}

/* Add a nice gradient fade at the bottom to indicate scrolling */
.table-container::after {
    content: '';
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(to top, rgba(255, 255, 255, 0.9), transparent);
    pointer-events: none;
    display: block;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.table-container.can-scroll::after {
    opacity: 1;
}

.status-badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    min-width: 80px;
    text-align: center;
}

.status-confirmed {
    background: #e8f5e9;
    color: var(--success-green);
    border: 1px solid #a5d6a7;
}

.status-completed {
    background: #f5f5f5;
    color: #666;
    border: 1px solid #ddd;
}

.status-cancelled {
    background: #ffebee;
    color: var(--error-red);
    border: 1px solid #ffcdd2;
}

.status-pending {
    background: #fff3e0;
    color: #f57c00;
    border: 1px solid #ffb74d;
}

.action-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.btn-action {
    padding: 6px 12px;
    border-radius: 15px;
    border: none;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 4px;
}

.btn-view {
    background: rgba(108, 153, 232, 0.1);
    color: var(--accent-blue);
    border: 1px solid rgba(108, 153, 232, 0.3);
}

.btn-view:hover {
    background: var(--accent-blue);
    color: white;
}

.btn-cancel-table {
    background: rgba(211, 47, 47, 0.1);
    color: var(--error-red);
    border: 1px solid rgba(211, 47, 47, 0.3);
}

.btn-cancel-table:hover {
    background: var(--error-red);
    color: white;
}

.btn-receipt {
    background: rgba(46, 125, 50, 0.1);
    color: var(--success-green);
    border: 1px solid rgba(46, 125, 50, 0.3);
}

.btn-receipt:hover {
    background: var(--success-green);
    color: white;
}

.btn-rebooking {
    background: rgba(255, 193, 7, 0.1);
    color: #FF9800;
    border: 1px solid rgba(255, 193, 7, 0.3);
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 4px;
}

.btn-rebooking:hover {
    background: #FF9800;
    color: white;
}

/* detail styles (for modal) */
.detail-section {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(10, 12, 107, 0.1);
}

.detail-section:last-child {
    border-bottom: none;
}

.detail-item {
    margin-bottom: 15px;
}

.detail-item label {
    display: block;
    font-size: 11px;
    margin-bottom: 5px;
    color: var(--text-grey);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: bold;
}

.detail-value {
    font-size: 14px;
    color: var(--deep-navy);
    font-weight: 500;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    border: 1px solid rgba(10, 12, 107, 0.1);
}

.notes-section {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed rgba(10, 12, 107, 0.1);
}

.notes-content {
    background: #f8f9ff;
    padding: 15px;
    border-radius: 10px;
    border-left: 3px solid var(--accent-blue);
    font-style: italic;
    color: var(--deep-navy);
    line-height: 1.5;
    font-size: 13px;
}

/* =========================================
           4. MODALS (unchanged, already good)
           ========================================= */
.popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 12, 107, 0.4);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup-box {
    background: rgba(255,255,255,0.95);
    width: 90%;
    max-width: 600px;
    max-height: 720px;
    overflow-y: auto;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    border: 1px solid white;
    animation: fadeIn 0.3s ease;
    scrollbar-width: thin;
    scrollbar-color: var(--accent-blue) #f1f1f1;
}

.popup-title {
    font-size: 20px;
    color: var(--deep-navy);
    margin-bottom: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.popup-msg {
    font-size: 14px;
    color: var(--text-grey);
    margin-bottom: 25px;
}

.btn-popup {
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    border: none;
    letter-spacing: 1px;
    transition: 0.3s;
    min-width: 120px;
}

.btn-confirm {
    background: var(--deep-navy);
    color: white;
    box-shadow: 0 5px 15px rgba(10, 12, 107, 0.2);
}

.btn-confirm:hover {
    background: #1a1d85;
    transform: translateY(-2px);
}

.btn-cancel-popup {
    background: transparent;
    border: 1px solid #ccc;
    color: var(--text-grey);
}

.btn-cancel-popup:hover {
    border-color: var(--deep-navy);
    color: var(--deep-navy);
}

.popup-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
}

#alertPopup, #confirmPopup {
    z-index: 9999;
}

/* Receipt modal styles */
.receipt-container {
    border: 2px dashed #ccc;
    padding: 20px;
    background: #fffcf5;
    text-align: left;
    margin-bottom: 20px;
    font-family: monospace;
}

.receipt-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
}

.receipt-total {
    border-top: 1px solid black;
    margin-top: 10px;
    padding-top: 10px;
    font-weight: bold;
}

/* Responsive */
@media (max-width: 768px) {
    .booking-table {
        font-size: 12px;
    }
    
    .booking-table th,
    .booking-table td {
        padding: 12px 10px;
    }
    
    .action-buttons {
        flex-direction: column;
        gap: 5px;
    }
    
    .btn-action {
        font-size: 9px;
        padding: 5px 8px;
    }
    
    .popup-box {
        padding: 25px;
        max-height: 600px;
    }

    .section-title-wrapper h1 {
        font-size: 30px;
    }
    
    .table-container {
        max-height: 500px;
    }
}
    </style>
</head>
<body>

    <nav>
        <div class="logo">Bléum Nails</div>
        <div class="menu">
            <button class="menu-item" onclick="window.location.href='client_dashboard.html'">Dashboard</button>
            <button class="menu-item active" onclick="window.location.href='client_booking.html'">History</button>
            <button class="menu-item" onclick="window.location.href='client_gallery.html'">Gallery</button>
            <button class="menu-item" onclick="window.location.href='client_feedback.html'">Feedback</button>
            <button class="menu-item" onclick="window.location.href='client_account.html'">Account</button>
            
            <div class="user-profile">
                <div class="user-avatar" id="navAvatar">U</div>
                <button class="btn-logout" onclick="app.logoutRequest()">Log Out</button>
            </div>
        </div>
    </nav>

<section id="dashboardSection" class="view-section">
    <!-- Title wrapper centered like other pages -->
    <div class="section-title-wrapper">
        <h1>Booking History</h1>
        <p class="sub-text" id="bookingCount">0 appointment(s)</p>
    </div>

    <!-- keep glass panel around table for consistent styling -->
    <div class="booking-summary-container glass-panel">
        <div class="table-container">
            <table class="booking-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    <tr id="noBookingsRow">
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-grey); font-style: italic;">
                            No appointments booked yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<!-- ALERT & CONFIRM MODALS -->
<div id="alertPopup" class="popup-overlay">
    <div class="popup-box">
        <h3 id="alertTitle" class="popup-title">Notification</h3>
        <p id="alertMessage" class="popup-msg">Message</p>
        <div class="popup-actions">
            <button class="btn-popup btn-confirm" onclick="app.closeAlert()">OK</button>
        </div>
    </div>
</div>

<div id="confirmPopup" class="popup-overlay">
    <div class="popup-box">
        <h3 id="confirmTitle" class="popup-title">Confirm</h3>
        <p id="confirmMessage" class="popup-msg">Sure?</p>
        <div class="popup-actions">
            <button class="btn-popup btn-cancel-popup" onclick="app.closeConfirm()">Cancel</button>
            <button class="btn-popup btn-confirm" id="confirmOkBtn">Confirm</button>
        </div>
    </div>
</div>

<!-- Receipt Modal -->
<div id="receiptModal" class="popup-overlay">
    <div class="popup-box" style="max-width: 500px;">
        <h2 class="popup-title">Payment Receipt</h2>
        <div class="receipt-container">
            <div style="text-align: center; margin-bottom: 15px; font-weight: bold;">BLÉUM NAILS</div>
            <div class="receipt-row"><span>Receipt No.:</span> <span id="recId">#12345</span></div>
            <div class="receipt-row"><span>Date:</span> <span id="recDate"></span></div>
            <div class="receipt-row"><span>Time:</span> <span id="recTime"></span></div>
            <div class="receipt-row"><span>Client:</span> <span id="recName"></span></div>
            <div class="receipt-row"><span>Service:</span> <span id="recService"></span></div>
            <div class="receipt-row receipt-total"><span>Total:</span> <span id="recTotal"></span></div>
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
            <button class="btn-popup btn-confirm" onclick="app.closeReceipt()">Close</button>
        </div>
    </div>
</div>

<script>
const AppState = {
    currentUser: null,
    currentReceiptData: null
};

const app = {
    init: function() {
        this.checkAuth();
        this.renderBookingSummary();
        this.updateProfileAvatar();
    },

    checkAuth: function() {
        const storedUser = sessionStorage.getItem('currentUser');
        if (!storedUser || storedUser === 'null') {
            window.location.href = 'login.html';
            return;
        }
        try {
            AppState.currentUser = JSON.parse(storedUser);
            if (!AppState.currentUser || !AppState.currentUser.email) throw new Error('invalid');
            
            const navAvatar = document.getElementById('navAvatar');
            if (AppState.currentUser.profileImage) {
                navAvatar.style.backgroundImage = `url(${AppState.currentUser.profileImage})`;
                navAvatar.style.backgroundSize = 'cover';
                navAvatar.innerText = '';
            } else {
                const initial = (AppState.currentUser.fullName || "U").charAt(0).toUpperCase();
                navAvatar.innerText = initial;
            }
        } catch (e) {
            window.location.href = 'login.html';
        }
    },

    updateProfileAvatar: function() {
        const navAvatar = document.getElementById('navAvatar');
        if (AppState.currentUser?.profileImage) {
            navAvatar.style.backgroundImage = `url(${AppState.currentUser.profileImage})`;
            navAvatar.style.backgroundSize = 'cover';
            navAvatar.innerText = '';
        } else {
            const initial = (AppState.currentUser?.fullName || "U").charAt(0).toUpperCase();
            navAvatar.innerText = initial;
            navAvatar.style.backgroundImage = 'none';
        }
    },

    // ----- BOOKING SUMMARY -----
    renderBookingSummary: function() {
        const tbody = document.getElementById('bookingTableBody');
        const countSpan = document.getElementById('bookingCount');
        const tableContainer = document.querySelector('.table-container');
        
        tbody.innerHTML = '';
        
        const all = JSON.parse(localStorage.getItem('allBookings')) || [];
        const user = all.filter(b => b.clientEmail === AppState.currentUser?.email);
        
        countSpan.innerText = `${user.length} appointment(s)`;
        
        // Increased threshold for scrolling and set a larger max-height
        if (user.length > 20) {
            tableContainer.style.maxHeight = '750px';
            tableContainer.style.overflowY = 'auto';
            tableContainer.classList.add('has-scroll');
        } else {
            tableContainer.style.maxHeight = 'none';
            tableContainer.style.overflowY = 'visible';
            tableContainer.classList.remove('has-scroll');
        }
        
        if (user.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-grey);font-style:italic;">No appointments booked yet.</td></tr>';
            tableContainer.style.maxHeight = 'none';
            return;
        }
        
        user.sort((a, b) => {
            const aCreated = a.createdAt ? new Date(a.createdAt) : new Date(0);
            const bCreated = b.createdAt ? new Date(b.createdAt) : new Date(0);
            
            if (a.createdAt && b.createdAt) {
                return bCreated - aCreated;
            }
            
            const aId = typeof a.id === 'number' ? a.id : parseInt(a.id) || 0;
            const bId = typeof b.id === 'number' ? b.id : parseInt(b.id) || 0;
            
            return bId - aId;
        });
        
        user.forEach(b => {
            const d = new Date(b.date);
            const fDate = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            
            let statusClass = 'status-pending', statusText = 'Pending';
            if (b.status === 'Confirmed') { 
                statusClass = 'status-confirmed'; 
                statusText = 'Confirmed'; 
            } else if (b.status === 'Completed') { 
                statusClass = 'status-completed'; 
                statusText = 'Completed'; 
            } else if (b.status === 'Cancelled') { 
                statusClass = 'status-cancelled'; 
                statusText = 'Cancelled'; 
            }

            let actions = `<button class="btn-action btn-view" onclick="app.viewBookingDetails('${b.id}')"><i class="fa-solid fa-eye"></i> View</button>`;
            
            if (b.status !== 'Completed' && b.status !== 'Cancelled') {
                actions += `<button class="btn-action btn-cancel-table" onclick="app.cancelBookingFromTable('${b.id}')"><i class="fa-solid fa-xmark"></i> Cancel</button>`;
            }
            
            if (b.paymentStatus === 'Paid' || b.status === 'Confirmed' || b.status === 'Completed') {
                actions += `<button class="btn-action btn-receipt" onclick="app.downloadReceipt('${b.id}')"><i class="fa-solid fa-receipt"></i> Receipt</button>`;
            }

            const amount = b.amount || b.price || 150;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><div style="font-weight:500;">${fDate}</div><small style="color:var(--text-grey);">#${b.id}</small></td>
                <td>${b.time}</td>
                <td>${b.service}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>₱${amount}</td>
                <td><div class="action-buttons">${actions}</div></td>
            `;
            
            tbody.appendChild(row);
        });
    },

    viewBookingDetails: function(id) {
        const all = JSON.parse(localStorage.getItem('allBookings')) || [];
        const b = all.find(x => x.id == id);
        if (!b) {
            this.showAlert("Error", "Booking not found.");
            return;
        }
        
        const d = new Date(b.date);
        const fDate = d.toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        
        const hasNotes = b.notes && b.notes.trim() !== "";
        
        let statusClass = 'status-pending';
        if (b.status === 'Confirmed') statusClass = 'status-confirmed';
        else if (b.status === 'Completed') statusClass = 'status-completed';
        else if (b.status === 'Cancelled') statusClass = 'status-cancelled';
        
        const modalContent = `
            <div class="booking-details-modal">
                <h3 style="color: var(--deep-navy); margin-bottom: 20px; text-align: center; font-weight: bold;">Booking Details</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                    <div class="detail-item">
                        <label>Booking ID</label>
                        <div class="detail-value">#${b.id}</div>
                    </div>
                    <div class="detail-item">
                        <label>Status</label>
                        <div class="detail-value">
                            <span class="status-badge ${statusClass}">${b.status || 'Pending'}</span>
                        </div>
                    </div>
                </div>
                
                <div class="detail-section">
                    <h4 style="color: var(--deep-navy); margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                        <i class="fa-solid fa-calendar-check" style="margin-right: 8px;"></i> Appointment Information
                    </h4>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                        <div class="detail-item">
                            <label>Date</label>
                            <div class="detail-value">${fDate}</div>
                        </div>
                        <div class="detail-item">
                            <label>Time</label>
                            <div class="detail-value">${b.time}</div>
                        </div>
                        <div class="detail-item">
                            <label>Service</label>
                            <div class="detail-value">${b.service}</div>
                        </div>
                        <div class="detail-item">
                            <label>Amount</label>
                            <div class="detail-value">₱${b.amount || '150'}.00</div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h4 style="color: var(--deep-navy); margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                            <i class="fa-solid fa-user" style="margin-right: 8px;"></i> Client Information
                        </h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="detail-item">
                                <label>Name</label>
                                <div class="detail-value">${b.clientName || 'N/A'}</div>
                            </div>
                            <div class="detail-item">
                                <label>Phone</label>
                                <div class="detail-value">${b.clientPhone || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="notes-section" ${!hasNotes ? 'style="display: none;"' : ''}>
                        <div class="detail-item">
                            <label style="color: var(--accent-blue);">
                                <i class="fa-solid fa-message" style="margin-right: 5px;"></i> Message / Notes
                            </label>
                            <div class="notes-content">
                                ${b.notes || 'No additional notes provided.'}
                            </div>
                        </div>
                    </div>
                </div>
                
                ${b.referenceImage ? `
                    <div class="detail-section">
                        <h4 style="color: var(--deep-navy); margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                            <i class="fa-solid fa-image" style="margin-right: 8px;"></i> Design Reference
                        </h4>
                        <div style="text-align: center;">
                            <img src="${b.referenceImage}" alt="Design Reference" 
                                 style="max-width: 250px; max-height: 250px; border-radius: 15px; border: 3px solid white; box-shadow: var(--shadow-soft);">
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
        
        const modal = document.createElement('div');
        modal.className = 'popup-overlay';
        modal.style.display = 'flex';
        modal.style.zIndex = '5000';
        modal.innerHTML = `
            <div class="popup-box" style="max-width: 600px; max-height: 720px; overflow-y: auto; padding: 30px;">
                ${modalContent}
                <div class="popup-actions" style="margin-top: 25px; border-top: 1px solid rgba(10, 12, 107, 0.1); padding-top: 20px;">
                    <button class="btn-popup btn-confirm" onclick="this.closest('.popup-overlay').remove()">
                        Close
                    </button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modal);
        
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.remove();
            }
        });
    },

    cancelBookingFromTable: function(id) {
        this.showConfirm("Cancel Appointment", "Are you sure you want to cancel this appointment? This action cannot be undone.", () => {
            const all = JSON.parse(localStorage.getItem('allBookings')) || [];
            
            const bookingIndex = all.findIndex(x => x.id == id);
            if (bookingIndex !== -1) {
                all[bookingIndex].status = 'Cancelled';
                localStorage.setItem('allBookings', JSON.stringify(all));
            }
            
            const userApptKey = `appt_${AppState.currentUser.email}`;
            const userAppt = JSON.parse(localStorage.getItem(userApptKey));
            if (userAppt && userAppt.id == id) {
                localStorage.removeItem(userApptKey);
            }
            
            this.renderBookingSummary();
            this.showAlert("Cancelled", "Your appointment has been cancelled successfully.");
        });
    },

    downloadReceipt: function(id) {
        const all = JSON.parse(localStorage.getItem('allBookings')) || [];
        const b = all.find(x => x.id == id);
        if (b) {
            this.showReceipt(b);
        } else {
            this.showAlert("Error", "Receipt not found.");
        }
    },

    showReceipt: function(booking) {
        this.closeAllModals();
        
        console.log("Showing receipt for booking:", booking);
        
        if (!booking) {
            console.error("No booking data available for receipt");
            this.showAlert("Error", "No receipt data available.");
            return;
        }
        
        let formattedDate = '';
        if (booking.date) {
            const bookingDate = new Date(booking.date);
            formattedDate = bookingDate.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        } else {
            formattedDate = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        let amount = booking.amount || booking.price || 150;
        
        if (typeof amount === 'string') {
            amount = parseFloat(amount) || 150;
        }
        
        const formattedAmount = `₱${amount.toFixed(2)}`;
        
        const recIdSpan = document.getElementById('recId');
        const recDateSpan = document.getElementById('recDate');
        const recTimeSpan = document.getElementById('recTime');
        const recNameSpan = document.getElementById('recName');
        const recServiceSpan = document.getElementById('recService');
        const recTotalSpan = document.getElementById('recTotal');
        
        if (recIdSpan) recIdSpan.innerText = "#" + (booking.id || Date.now());
        if (recDateSpan) recDateSpan.innerText = formattedDate;
        if (recTimeSpan) recTimeSpan.innerText = booking.time || 'N/A';
        if (recNameSpan) recNameSpan.innerText = booking.clientName || AppState.currentUser?.fullName || 'Customer';
        if (recServiceSpan) recServiceSpan.innerText = booking.service || 'Nail Service';
        if (recTotalSpan) recTotalSpan.innerText = formattedAmount;
        
        AppState.currentReceiptData = {
            booking: booking,
            formattedDate: formattedDate,
            amount: formattedAmount
        };
        
        document.getElementById('receiptModal').style.display = 'flex';
    },

    closeReceipt: function() {
        document.getElementById('receiptModal').style.display = 'none';
        AppState.currentReceiptData = null;
    },

    // ----- UTILITY -----
    showAlert: function(title, msg) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerText = msg;
        document.getElementById('alertPopup').style.display = 'flex';
    },

    closeAlert: function() { 
        document.getElementById('alertPopup').style.display = 'none'; 
    },

    showConfirm: function(title, msg, callback) {
        document.getElementById('confirmTitle').innerText = title;
        document.getElementById('confirmMessage').innerText = msg;
        const okBtn = document.getElementById('confirmOkBtn');
        const newBtn = okBtn.cloneNode(true);
        okBtn.parentNode.replaceChild(newBtn, okBtn);
        newBtn.addEventListener('click', () => { 
            this.closeAllModals(); 
            if (callback) callback(); 
        });
        document.getElementById('confirmPopup').style.display = 'flex';
    },

    closeConfirm: function() { 
        document.getElementById('confirmPopup').style.display = 'none'; 
    },

    closeAllModals: function() {
        document.querySelectorAll('.popup-overlay').forEach(m => m.style.display = 'none');
    },

    logoutRequest: function() {
        this.showConfirm("Log Out", "Are you sure?", () => { 
            sessionStorage.clear(); 
            window.location.href = "../entry/login.html"; 
        });
    }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
