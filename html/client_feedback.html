<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Bléum Nails</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           1. CORE VARIABLES & RESET
           ========================================= */
:root {
    --bg-cream: #fffff0;
    --accent-blue: #6c99e8;
    --deep-navy: #0a0c6b;
    --text-white: #ffffff;
    --text-grey: #666;
    --error-red: #d32f2f;
    --success-green: #2e7d32;
    --font-main: "Times New Roman", Times, serif;
    --shadow-soft: 0 10px 30px rgba(10, 12, 107, 0.05);
    --shadow-hover: 0 15px 40px rgba(10, 12, 107, 0.1);
    --gold: #FFD700;
}

* {
    box-sizing: border-box;
    font-family: var(--font-main);
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-cream);
    color: var(--deep-navy);
    background-image: 
        radial-gradient(circle at 0% 0%, rgba(108, 153, 232, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(108, 153, 232, 0.3) 0%, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
}

body::-webkit-scrollbar {
    display: none;
    width: 0;
    background: transparent;
}

body {
    -ms-overflow-style: none; 
    scrollbar-width: none;  
}

html {
    overflow-y: scroll;
    scrollbar-width: none;
    -ms-overflow-style: none; 
}

html::-webkit-scrollbar {
    display: none;
}

button, input, select, textarea {
    outline: none;
    font-family: inherit;
}

h1, h2, h3 {
    font-weight: normal;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* =========================================
           2. NAVIGATION BAR
           ========================================= */
nav {
    background: rgba(255, 255, 255, 0.3);
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    height: 55px;
    padding: 0 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 5px 20px rgba(0,0,0,0.02);
}

.logo {
    font-size: 24px;
    color: var(--deep-navy);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: bold;
}

.menu {
    display: flex;
    gap: 30px;
    align-items: center;
}

.menu-item {
    background: none;
    border: none;
    color: var(--deep-navy);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
    font-weight: bold;
    padding: 8px 12px;
    border-radius: 20px;
}

.menu-item:hover,
.menu-item.active {
    background: rgba(255,255,255,0.6);
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 15px;
    border-left: 1px solid rgba(10, 12, 107, 0.1);
    padding-left: 20px;
}

.user-avatar {
    width: 35px;
    height: 35px;
    background: var(--deep-navy);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.btn-logout {
    background: transparent;
    color: var(--text-grey);
    border: none;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
    font-weight: bold;
}

.btn-logout:hover {
    color: var(--error-red);
}

/* =========================================
           3. FEEDBACK SECTION (full)
           ========================================= */
.view-section {
    max-width: 1100px;
    margin: 50px auto;
    padding: 0 20px;
    display: block;
    animation: fadeIn 0.5s ease-out;
}

.section-title-wrapper {
    text-align: center;
    margin-bottom: 35px;
}

.section-title-wrapper h1 {
    font-size: 38px;
    color: var(--deep-navy);
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.section-title-wrapper .sub-text {
    font-size: 16px;
    color: var(--text-grey);
    font-style: italic;
}

.feedback-panel {
    max-width: 650px;
    margin: 0 auto;
    padding: 40px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    box-shadow: var(--shadow-soft);
    border: 1px solid white;
}

.review-form {
    border-bottom: 1px solid rgba(10, 12, 107, 0.1);
    padding-bottom: 30px;
    margin-bottom: 30px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.stars-input {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    font-size: 32px;
    cursor: pointer;
    color: #e0e0e0;
    justify-content: center;
    transition: 0.3s;
}

.stars-input i:hover {
    color: #ffe066;
}

.stars-input i.active {
    color: var(--gold);
    filter: drop-shadow(0 2px 4px rgba(255, 215, 0, 0.2));
}

.review-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.review-card {
    display: flex;
    gap: 15px;
    padding: 20px;
    background: rgba(255,255,255,0.8);
    border-radius: 15px;
    border: 1px solid white;
    align-items: flex-start;
    box-shadow: 0 5px 15px rgba(10, 12, 107, 0.03);
    transition: 0.3s;
}

.review-card:hover {
    background: white;
    box-shadow: var(--shadow-soft);
}

.review-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
}

.review-content h4 {
    font-size: 14px;
    margin-bottom: 5px;
    color: var(--deep-navy);
    font-weight: bold;
}

.review-stars {
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 8px;
}

.review-text {
    font-size: 13px;
    color: var(--deep-navy);
    font-style: italic;
    line-height: 1.5;
}

/* =========================================
           4. FORMS & INPUTS (shared)
           ========================================= */
.input-group {
    text-align: left;
    width: 100%;
}

.input-group label {
    display: block;
    font-size: 11px;
    margin-top: 5px;
    margin-bottom: 8px;
    font-weight: bold;
    color: var(--text-grey);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-left: 10px;
}

.input-field {
    width: 100%;
    padding: 15px 20px;
    border: 1px solid rgba(10, 12, 107, 0.1);
    border-radius: 50px;
    background: rgba(255,255,255,0.9);
    font-size: 14px;
    color: var(--deep-navy);
    transition: 0.3s;
}

.input-field:focus {
    border-color: var(--accent-blue);
    background: white;
    box-shadow: 0 0 0 4px rgba(108, 153, 232, 0.1);
}

.input-field textarea {
    resize: vertical;
    height: 80px;
    border-radius: 20px;
}

.file-upload {
    background: rgba(249, 250, 255, 0.8);
    padding: 25px;
    border-radius: 15px;
    border: 2px dashed rgba(10, 12, 107, 0.15);
    text-align: center;
    margin: 20px 0;
    width: 100%;
    cursor: pointer;
    transition: 0.3s;
}

.file-upload:hover {
    border-color: var(--accent-blue);
    background: rgba(255,255,255,0.5);
}

.file-upload label {
    font-size: 12px;
    font-weight: bold;
    color: var(--deep-navy);
    text-transform: uppercase;
    display: block;
    margin-bottom: 10px;
    cursor: pointer;
}

.file-upload label i {
    font-size: 24px;
    display: block;
    margin-bottom: 10px;
    color: var(--accent-blue);
}

.btn-popup {
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    border: none;
    letter-spacing: 1px;
    transition: 0.3s;
    min-width: 120px;
}

.btn-confirm {
    background: var(--deep-navy);
    color: white;
    box-shadow: 0 5px 15px rgba(10, 12, 107, 0.2);
}

.btn-confirm:hover {
    background: #1a1d85;
    transform: translateY(-2px);
}

/* =========================================
           5. ALERT/CONFIRM MODALS (minimal)
           ========================================= */
.popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 12, 107, 0.4);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#alertPopup, #confirmPopup {
    z-index: 9999;
}

.popup-box {
    background: rgba(255,255,255,0.95);
    width: 90%;
    max-width: 450px;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
    border: 1px solid white;
    animation: fadeIn 0.3s ease;
}

.popup-title {
    font-size: 20px;
    color: var(--deep-navy);
    margin-bottom: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.popup-msg {
    font-size: 14px;
    color: var(--text-grey);
    margin-bottom: 25px;
}

.btn-cancel-popup {
    background: transparent;
    border: 1px solid #ccc;
    color: var(--text-grey);
}

.btn-cancel-popup:hover {
    border-color: var(--deep-navy);
    color: var(--deep-navy);
}

.popup-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
}
    </style>
</head>
<body>

<nav>
        <div class="logo">Bléum Nails</div>
        <div class="menu">
            <button class="menu-item" onclick="window.location.href='client_dashboard.html'">Dashboard</button>
            <button class="menu-item" onclick="window.location.href='client_booking.html'">History</button>
            <button class="menu-item" onclick="window.location.href='client_gallery.html'">Gallery</button>
            <button class="menu-item active" onclick="window.location.href='client_feedback.html'">Feedback</button>
            <button class="menu-item" onclick="window.location.href='client_account.html'">Account</button>
            
            <div class="user-profile">
                <div class="user-avatar" id="navAvatar">U</div>
                <button class="btn-logout" onclick="app.logoutRequest()">Log Out</button>
            </div>
        </div>
    </nav>

<section id="feedbackSection" class="view-section">
    <div class="section-title-wrapper">
        <h1>Client Reviews</h1>
        <p class="sub-text">Share your experience with us.</p>
    </div>

    <div class="feedback-panel">
        <div class="review-form">
            <h3 style="margin-bottom: 20px; font-weight: bold; color: var(--deep-navy);">Leave a Review</h3>
            
            <div class="stars-input" id="starRating">
                <i class="fa-solid fa-star" data-val="1"></i>
                <i class="fa-solid fa-star" data-val="2"></i>
                <i class="fa-solid fa-star" data-val="3"></i>
                <i class="fa-solid fa-star" data-val="4"></i>
                <i class="fa-solid fa-star" data-val="5"></i>
            </div>

            <div class="input-group">
                <textarea id="reviewText" class="input-field" rows="3" placeholder="Tell us about your experience..." 
                style="resize: none; height: 100px; min-height: 100px; max-height: 100px;"></textarea>
            </div>

            <div class="file-upload">
                <label><i class="fa-solid fa-camera"></i> Upload Finished Nails Photo</label>
                <input type="file" id="reviewImage" accept="image/*">
            </div>

            <button class="btn-popup btn-confirm" style="width: 100%; max-width: 300px; margin-top: 15px;" onclick="app.submitReview()">Post Review</button>
        </div>

        <div class="review-list-wrapper">
            <h3 style="margin-bottom: 20px; font-weight: bold; color: var(--deep-navy); text-align: center; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">Recent Feedback</h3>
            <div class="review-list" id="reviewsList"></div>
        </div>
    </div>
</section>

<!-- ALERT & CONFIRM MODALS (kept for logout and messages) -->
<div id="alertPopup" class="popup-overlay">
    <div class="popup-box">
        <h3 id="alertTitle" class="popup-title">Notification</h3>
        <p id="alertMessage" class="popup-msg">Message</p>
        <div class="popup-actions">
            <button class="btn-popup btn-confirm" onclick="app.closeAlert()">OK</button>
        </div>
    </div>
</div>

<div id="confirmPopup" class="popup-overlay">
    <div class="popup-box">
        <h3 id="confirmTitle" class="popup-title">Confirm</h3>
        <p id="confirmMessage" class="popup-msg">Sure?</p>
        <div class="popup-actions">
            <button class="btn-popup btn-cancel-popup" onclick="app.closeConfirm()">Cancel</button>
            <button class="btn-popup btn-confirm" id="confirmOkBtn">Confirm</button>
        </div>
    </div>
</div>

<script>
    const AppState = {
        currentUser: null,
        reviewImage: null,
        currentRating: 0
    };

    const app = {
        init: function() {
            this.checkAuth();
            this.setupListeners();
            this.renderReviews();
            // setup avatar display
            this.updateProfileAvatar();
        },

        setupListeners: function() {
            const reviewInput = document.getElementById('reviewImage');
            if (reviewInput) {
                reviewInput.addEventListener('change', (e) => this.handleImageUpload(e));
            }

            document.querySelectorAll('#starRating i').forEach(star => {
                star.addEventListener('click', (e) => {
                    const val = parseInt(e.target.dataset.val);
                    AppState.currentRating = val;
                    this.updateStarVisuals(val);
                });
            });
        },

        updateStarVisuals: function(val) {
            document.querySelectorAll('#starRating i').forEach(s => {
                const starVal = parseInt(s.dataset.val);
                if (starVal <= val) {
                    s.classList.add('active');
                    s.classList.remove('fa-regular');
                    s.classList.add('fa-solid');
                } else {
                    s.classList.remove('active');
                    s.classList.remove('fa-solid');
                    s.classList.add('fa-regular');
                }
            });
        },

        handleImageUpload: function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    AppState.reviewImage = reader.result;
                };
                reader.readAsDataURL(file);
            }
        },

        checkAuth: function() {
            const storedUser = sessionStorage.getItem('currentUser');
            if (!storedUser || storedUser === 'null' || storedUser === 'undefined') {
                window.location.href = 'login.html';
                return;
            }
            try {
                AppState.currentUser = JSON.parse(storedUser);
                if (!AppState.currentUser || !AppState.currentUser.email) throw new Error('invalid');

                // Set nav avatar
                const navAvatar = document.getElementById('navAvatar');
                if (AppState.currentUser.profileImage) {
                    navAvatar.style.backgroundImage = `url(${AppState.currentUser.profileImage})`;
                    navAvatar.style.backgroundSize = 'cover';
                    navAvatar.innerText = '';
                } else {
                    const initial = (AppState.currentUser.fullName || "U").charAt(0).toUpperCase();
                    navAvatar.innerText = initial;
                    navAvatar.style.backgroundImage = 'none';
                }
            } catch (e) {
                window.location.href = 'login.html';
            }
        },

        updateProfileAvatar: function() {
            // only nav avatar needed, but keep method for consistency
            const navAvatar = document.getElementById('navAvatar');
            if (AppState.currentUser?.profileImage) {
                navAvatar.style.backgroundImage = `url(${AppState.currentUser.profileImage})`;
                navAvatar.style.backgroundSize = 'cover';
                navAvatar.innerText = '';
            } else {
                const initial = (AppState.currentUser?.fullName || "U").charAt(0).toUpperCase();
                navAvatar.innerText = initial;
                navAvatar.style.backgroundImage = 'none';
            }
        },

        submitReview: function() {
            const text = document.getElementById('reviewText').value;
            
            if (!AppState.currentRating || !text) {
                this.showAlert("Error", "Please provide a rating and comment.");
                return;
            }

            const newReview = {
                name: AppState.currentUser.fullName || "Anonymous",
                rating: AppState.currentRating,
                comment: text,
                image: AppState.reviewImage,
                date: new Date().toLocaleDateString()
            };

            let reviews = JSON.parse(localStorage.getItem('clientReviews')) || [];
            reviews.unshift(newReview);
            localStorage.setItem('clientReviews', JSON.stringify(reviews));

            this.showAlert("Thank You", "Review posted successfully!");
            
            document.getElementById('reviewText').value = '';
            document.getElementById('reviewImage').value = '';
            AppState.reviewImage = null;
            AppState.currentRating = 0;
            this.updateStarVisuals(0);
            
            this.renderReviews();
        },

        renderReviews: function() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = '';
            const reviews = JSON.parse(localStorage.getItem('clientReviews')) || [];

            if (reviews.length === 0) {
                reviews.push({
                    name: "Micah (Admin)",
                    rating: 5,
                    comment: "Welcome to Bleum Nails! Post your first review here.",
                    date: "Admin",
                    image: null
                });
            }

            reviews.forEach(r => {
                let starsHtml = '';
                for (let i = 0; i < 5; i++) {
                    if (i < r.rating) {
                        starsHtml += '<i class="fa-solid fa-star"></i>';
                    } else {
                        starsHtml += '<i class="fa-regular fa-star"></i>';
                    }
                }

                const imgHtml = r.image 
                    ? `<img src="${r.image}" class="review-img">` 
                    : `<div class="review-img" style="background:#ddd;display:flex;align-items:center;justify-content:center;font-size:10px;">No Photo</div>`;

                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    ${imgHtml}
                    <div class="review-content">
                        <h4>${r.name} <small style="font-weight:normal;font-size:11px;color:#999;">${r.date}</small></h4>
                        <div class="review-stars">${starsHtml}</div>
                        <p class="review-text">"${r.comment}"</p>
                    </div>
                `;
                list.appendChild(card);
            });
        },

        // ----- Alert / Confirm (same as before) -----
        showAlert: function(title, msg) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = msg;
            document.getElementById('alertPopup').style.display = 'flex';
        },
        closeAlert: function() {
            document.getElementById('alertPopup').style.display = 'none';
        },

        showConfirm: function(title, msg, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = msg;
            const okBtn = document.getElementById('confirmOkBtn');
            const newBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newBtn, okBtn);
            newBtn.addEventListener('click', () => {
                this.closeAllModals();
                if (callback) callback();
            });
            document.getElementById('confirmPopup').style.display = 'flex';
        },
        closeConfirm: function() {
            document.getElementById('confirmPopup').style.display = 'none';
        },

        closeAllModals: function() {
            document.querySelectorAll('.popup-overlay').forEach(m => m.style.display = 'none');
        },

        logoutRequest: function() {
        this.showConfirm("Log Out","Are you sure?",()=>{ sessionStorage.clear(); window.location.href="../entry/login.html"; });
    }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
